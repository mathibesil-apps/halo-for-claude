<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3138"></stop><stop offset="42%" stop-color="#1b1f24"></stop><stop offset="100%" stop-color="#0e1216"></stop>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34C759" stop-opacity="0.35"></stop>
      <stop offset="40%" stop-color="#3cdcb4" stop-opacity="0.14"></stop>
      <stop offset="68%" stop-color="#34C759" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5be08a"></stop><stop offset="55%" stop-color="#34C759"></stop><stop offset="100%" stop-color="#22b8a0"></stop>
    </linearGradient>
    <radialGradient id="sheen" cx="50%" cy="-10%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"></stop><stop offset="55%" stop-color="#ffffff" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <clipPath id="clip"><rect x="0" y="0" width="1024" height="1024" rx="224"></rect></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#tile)"></rect>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#sheen)"></rect>
    <circle cx="512" cy="512" r="320" fill="url(#halo)"></circle>
    <circle cx="512" cy="512" r="300" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="70"></circle>
    <circle cx="512" cy="512" r="205" fill="none" stroke="#5be08a" stroke-opacity="0.22" stroke-width="20"></circle>
    <g filter="url(#glow)">
      <circle cx="512" cy="512" r="300" fill="none" stroke="url(#ring)" stroke-width="70" stroke-linecap="round" stroke-dasharray="1507.9644737231008 1884.9555921538758" transform="rotate(-90 512 512)"></circle>
    </g>
    <rect x="1" y="1" width="1022" height="1022" rx="223" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"></rect>
  </g>
